<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Live Subtitles</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      margin: 0;
    }

    #status {
      padding: 8px 16px;
      font-size: 0.9em;
      color: #999;
    }

    #feed {
      list-style: none;
      margin: 0;
      padding: 16px;
      max-height: 100vh;
      overflow-y: auto;
    }

    #feed li {
      margin-bottom: 20px;
    }

    .de {
      display: block;
      font-size: 0.85em;
      color: #999;
    }

    .en {
      display: block;
      font-size: 1.6em;
      color: #fff;
    }

    .route {
      font-size: 0.6em;
      color: #888;
      margin-right: 8px;
    }

    .canonical {
      margin-top: 8px;
      padding: 8px 12px;
      border-left: 3px solid #c9a227;
      background: #1c1a10;
      font-size: 0.9em;
      color: #e8dfb8;
    }

    .canonical.possible {
      border-left-color: #666;
      background: #181818;
      color: #999;
    }

    .canonical.possible .ref {
      color: #888;
    }

    .canonical .ref {
      display: block;
      font-size: 0.75em;
      color: #c9a227;
      margin-bottom: 2px;
    }
  </style>
</head>

<body>
  <div id="status">connecting...</div>
  <ul id="feed"></ul>
  <script>
    const statusEl = document.getElementById("status");
    const feedEl = document.getElementById("feed");
    const MAX_VISIBLE = 20;

    function connect() {
      const ws = new WebSocket(`ws://${window.location.host}/ws`);

      ws.onopen = () => { statusEl.textContent = "connected"; };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        const li = document.createElement("li");
        const routeLabel = msg.downgraded ? `llm→${msg.route}` : msg.route;
        const route = routeLabel ? `<span class="route">[${routeLabel}]</span>` : "";
        li.innerHTML = `<span class="de">${msg.text_de}</span><span class="en">${route} ${msg.text_en}</span>`;
        if (msg.canonical) {
          // Verified verse text, shown apart from the live translation so a
          // reader can compare the two when the translation drifts.
          const box = document.createElement("div");
          const possible = msg.canonical.tier === "possible";
          box.className = possible ? "canonical possible" : "canonical";
          const ref = document.createElement("span");
          ref.className = "ref";
          ref.textContent = possible
            ? `${msg.canonical.ref} (possible match, ${msg.canonical.source})`
            : `${msg.canonical.ref} (verified, ${msg.canonical.source})`;
          const text = document.createElement("span");
          text.textContent = msg.canonical.en || msg.canonical.de;
          box.append(ref, text);
          li.appendChild(box);
        }
        feedEl.appendChild(li);
        while (feedEl.children.length > MAX_VISIBLE) {
          feedEl.removeChild(feedEl.firstChild);
        }
        feedEl.scrollTop = feedEl.scrollHeight;
      };

      ws.onclose = () => {
        statusEl.textContent = "disconnected, retrying";
        setTimeout(connect, 2000);
      };
    }

    connect();
  </script>
</body>

</html>
